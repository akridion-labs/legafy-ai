[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legafy-ai"
version = "1.0.0"
description = "Legafy AI — model-agnostic pre-counsel compliance scaffolding engine (Akridion Labs)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Akridion Labs LLP" }]
keywords = ["legal-tech", "compliance", "mcp", "fastapi", "dpdp", "india"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path. Without this, `.venv/bin/pytest` (and
# `.venv\Scripts\pytest` on Windows) fails every test module with
# "ModuleNotFoundError: No module named 'app'" — the console script does not add
# the working directory the way `python -m pytest` does. `make test` calls the
# console script, so a fresh clone would fail on the first command a tester runs.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008", "E501", "UP042"]  # UP042: str+Enum is deliberate for JSON round-tripping

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
