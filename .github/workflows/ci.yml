name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dependency advisory lands on a day nobody is committing. Without this,
  # the audit only ever runs when someone happens to push, so a quiet repo is
  # a repo that has stopped looking. Daily at 06:30 IST (01:00 UTC).
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

# Least privilege by default. Any job needing more asks for it explicitly.
permissions:
  contents: read

jobs:

  audit:
    name: dependency advisories (pip-audit)
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: test`. On the nightly run there is no new code
    # to test — the question is whether the world changed under code that was
    # already green, and that answer must not wait behind a test matrix or be
    # skipped because something unrelated broke.
    permissions:
      contents: read
      issues: write        # only to raise the alarm below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audited against the pinned files, not against whatever resolved into
      # the runner. The question is "is what we ship vulnerable", and what we
      # ship is these two files.
      - name: Audit runtime dependencies
        id: runtime
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Audit development dependencies
        if: always()
        run: pip-audit -r requirements-dev.txt --progress-spinner off

      # A failed nightly run is an email nobody opens. An issue is a thing with
      # a state, an assignee and a date, which is what a response needs.
      - name: Open an issue if an advisory landed
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Dependency advisory: nightly pip-audit failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "security",
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ["security"],
              body: [
                "The nightly dependency audit failed, which means an advisory now",
                "affects a pinned dependency.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Follow **SECURITY.md section 6 — When an advisory lands**. Do not",
                "close this issue until either the pin is bumped and the audit is",
                "green, or the finding is recorded there as accepted with a reason",
                "and a date.",
              ].join("\n"),
            });
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.11 through 3.14. An untested claim is a
        # promise, not a fact — and 3.14 is what runs on the Mac.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  docker:
    name: docker image boots
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t legafy-ai:ci .

      - name: Run container
        run: |
          docker run --rm \
            --name legafy-ci \
            -e LEGAFY_ENV=development \
            -e LEGAFY_BOOTSTRAP_TOKENS_ENABLED=true \
            -p 127.0.0.1:8000:8000 \
            -d legafy-ai:ci

      - name: Wait for /healthz (fail after 60s)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "Healthy after ${i}x2s."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 60s." >&2
          docker logs legafy-ci || true
          exit 1

      - name: Stop container
        if: always()
        run: docker stop legafy-ci || true

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runner images ship shellcheck preinstalled; no extra
      # action/dependency needed.
      - name: Run shellcheck
        run: shellcheck setup_tunnel.sh scripts/*.sh
